apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: avatar-service
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: avatar-service
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
