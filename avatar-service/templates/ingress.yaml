apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avatar-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/client-body-timeout: "60"
    cert-manager.io/issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - avatars.example.com
    secretName: avatars-example-com-tls
  rules:
  - host: avatars.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: avatar-service
            port:
              number: 80
