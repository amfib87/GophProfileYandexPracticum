apiVersion: batch/v1
kind: Job
metadata:
  name: avatar-migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: avatar-service:latest
        command: ["goose", "up"]
        envFrom:
        - secretRef:
            name: avatar-secrets
        - configMapRef:
            name: avatar-config
