<!DOCTYPE html>
<html>
<head><title>Загрузить аватар</title></head>
<body>
    <h1>Загрузка аватарки</h1>
    <form action="/web/upload" method="post" enctype="multipart/form-data">
        <label>User ID: <input type="text" name="user_id" required></label><br><br>
        <label>Файл: <input type="file" name="file" accept="image/*" required></label><br><br>
        <button type="submit">Загрузить</button>
    </form>
</body>
</html>
